
services:
  # ─── MySQL Database ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: store_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Express API Server ──────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: store_server
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DIALECT: ${DB_DIALECT}
      SERVER_PORT: ${SERVER_PORT}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  # ─── React Admin Dashboard ──────────────────────────
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: store_dashboard
    restart: unless-stopped
    environment:
      PORT: ${CLIENT_PORT:-3001}
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    ports:
      - "${CLIENT_PORT:-3001}:${CLIENT_PORT:-3001}"
    volumes:
      - ./admin-dashboard:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mysql_data:
